[package]
name = "RustyAI"
version = "0.1.0"
edition = "2021"
authors = ["RustyAI Contributors"]
license = "MIT OR Apache-2.0"
description = "Comprehensive Rust framework for building intelligent, autonomous multi-agent systems"
repository = "https://github.com/rustyai/rustyai"
documentation = "https://docs.rs/RustyAI"
keywords = ["agents", "multi-agent", "AOP", "autonomous", "coordination"]
categories = ["simulation", "algorithms"]
readme = "README.md"

[dependencies]
agent-core = { path = "../agent-core" }
messaging = { path = "../messaging" }
cognition = { path = "../cognition" }
patterns = { path = "../patterns" }
runtime = { path = "../runtime" }

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
tokio-test = "0.4"
anyhow = "1.0"

[[example]]
name = "quickstart"
path = "examples/quickstart.rs"

[[example]]
name = "messaging"
path = "examples/messaging.rs"

[[example]]
name = "swarm"
path = "examples/swarm.rs"

[[example]]
name = "full_stack"
path = "examples/full_stack.rs"
